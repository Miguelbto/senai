# mosquitto.conf — Configuração do Broker MQTT
# ─────────────────────────────────────────────────────────────────
# Copie este arquivo para:
#   Windows: C:\Program Files\mosquitto\mosquitto.conf
#   Linux:   /etc/mosquitto/mosquitto.conf
#   macOS:   /usr/local/etc/mosquitto/mosquitto.conf
#
# Após copiar, reinicie o serviço:
#   Windows (PowerShell Admin):
#     net stop mosquitto
#     net start mosquitto
#
#   Linux/macOS:
#     sudo systemctl restart mosquitto

# ── Porta para o Pico 2W (TCP direto) ────────────────────────────
listener 1883
protocol mqtt
allow_anonymous true      # sem usuário/senha (só para testes)

# ── Porta para o dashboard no navegador (WebSocket) ───────────────
# O browser não faz TCP puro — precisa de WebSocket
# Sem "protocol websockets" o browser não consegue conectar
listener 8000
protocol websockets
allow_anonymous true

# ── Log no terminal ───────────────────────────────────────────────
log_type all              # mostra conexões e mensagens em tempo real
log_dest stdout           # exibe logs no console

# ── Configurações Opcionais de Performance ────────────────────────
max_connections -1        # sem limite de conexões
max_queued_messages 1000  # limite de mensagens em fila
message_size_limit 0      # sem limite de tamanho de mensagem
