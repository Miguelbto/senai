<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficina - Agendamentos</title>
</head>
<body>

    <h1>Oficina - Agendamentos</h1>

    <p><a href="/principal">Voltar</a></p>

    <table border='1'>
        <tr>
            <th>Data</th>
            <th>Serviço</th>
            <th>Veiculo</th>
            <th>Cliente</th>
            <th>Alterar data</th>
            <th>Excluir</th>
        </tr>

        {{#agendamentos}}
        <tr>
            <td>{{data_br}}</td>
            <td>{{servico}}</td>
            <td>{{placa}}</td>
            <td>{{cliente_nome}}</td>
            <td>
                <form method="POST" action="/agendamentos/{{id}}">
                    <input type="hidden" name="_method" value="PUT">
                    <input type="datetime-local" name="data_agendamento" value="{{data_input}}" required>
                    <button>Salvar</button>
                </form>
            </td>
            <td>
                <form method="POST" action="/agendamentos/{{id}}">
                    <input type="hidden" name="_method" value="DELETE">
                    <button>Excluir</button>
                </form>
            </td>
        </tr>
        {{/agendamentos}}
    </table>

    <h2>Cadastrar Agendamento</h2>

    <form method="POST" action="/agendamentos">
        <select name="veiculo_id" required>
            <option value="">Selecione o veiculo</option>
            {{#veiculos}}
            <option value="{{id}}">{{placa}} - {{marca}} - {{modelo}}</option>
            {{/veiculos}}
        </select>
        <input type="datetime-local" name="data_agendamento" required>
        <input type="text" name="servico" placeholder="Serviço"/>
        <button>Cadastrar</button>
    </form>
    
</body>
</html>
